[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Allow `dict()` over literal in places that are clearer that way.
    "B009",
    # The script uses `exit()` (builtin) rather than sys.exit(); keep it.
    "RUF012",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real ZFS userspace and root (skipped in unit-test runs)",
]
addopts = "-ra --strict-markers"
